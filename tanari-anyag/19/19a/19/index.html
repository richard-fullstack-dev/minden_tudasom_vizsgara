<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container p-2">

        <label class="form-label">Kiinduló érték</label>
        <input id="inp_start" type="number" class="form-control" value="1" />

        <label class="form-label mt-2">Záró érték</label>
        <input id="inp_end" type="number" class="form-control" value="10" />

        <button class="btn btn-primary mt-2" onclick="hello()">Kattints ide</button>

        <div id="result">

        </div>

    </div>


    <script>
        function hello(){

            //egy-egy változóba megkeressük az inp_start és inp_end inputmezők
            //tartalmát (value tulajdonság) és ezeket számmá alakítjuk, mert
            //alapvetően stringként kapjuk meg
            let start = parseInt(document.getElementById('inp_start').value);
            let end = parseInt(document.getElementById('inp_end').value);

            document.getElementById('result').innerHTML = '';

            for(let i = start; i <= end; i++){
                //keressük ki id alapján a result id-ra hallgató
                //HTML elemet (ami amúgy egy div)
                //és ennek a HTML kódjához fűzzük hozzá az
                //i aktuális értékét
                //document.getElementById('result').innerHTML += 
                //'<span class="badge text-bg-warning m-1">' + i + '</span>'

                //altgr + 7 ferde aposztróf => ezen belül ${} blokk kiértékeli a változót
                //vagyis nem kell a stringet megtörni
                document.getElementById('result').innerHTML += 
                `<span class="badge text-bg-warning m-1">${i}</span>`
            }
        }
    </script>
</body>

</html>
