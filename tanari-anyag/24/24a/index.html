<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container-lg">
        <div class="row">
            <div class="col-lg-6 mt-2">
                <!--form-->
                <label class="form-label">Szuperhős neve</label>
                <input id="inp_name" type="text" class="form-control" />
                <label class="form-label mt-2">Melyik oldalon harcol?</label>
                <select id="sel_side" class="form-select">
                    <option value="good">jó</option>
                    <option value="bad">rossz</option>
                    <option value="civil">civil</option>
                </select>
                <label class="form-label mt-2">Szuperhős ereje</label>
                <input id="inp_power" type="range" class="form-range" min="0" max="10" value="5" oninput="rangeChange(event)" />
                <div id="range-result" class="text-center">5</div>
                <label class="form-label mt-2">Van mutáns képessége?</label>
                <div>
                    <div class="form-check form-check-inline">
                        <input id="radio_mutant_yes" class="form-check-input" type="radio" name="ismutant" value="option1" onchange="mutantQuestionOn()">
                        <label class="form-check-label">igen</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input id="radio_mutant_no" class="form-check-input" type="radio" name="ismutant" checked value="option2" onchange="mutantQuestionOff()">
                        <label class="form-check-label">nem</label>
                    </div>
                </div>
                <div id="mutantQuestion" style="display: none;">
                    <label class="form-label mt-2">Mi a mutáns képessége?</label>
                    <input id="inp_ability" type="text" class="form-control" />
                </div>
                <button onclick="addHero()" class="btn btn-primary mt-2">Szuperhős hozzáadása</button>
            </div>
            <div class="col-lg-6 mt-2">
                <table class="table table-striped table-bordered text-center">
                    <thead>
                        <tr>
                            <th>Szuperhős neve</th>
                            <th>Szuperhős ereje</th>
                            <th>Mutáns képesség</th>
                            <th>Törlés</th>
                        </tr>
                    </thead>
                    <tbody id="table_body">
                        
                    </tbody>
                </table>
            </div>
        </div>
    </div>









    <script src="script.js"></script>

</body>

</html>
