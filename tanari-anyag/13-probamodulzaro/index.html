<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulzáró</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-md bg-body-tertiary">

        <div class="container-fluid">
            <a class="navbar-brand">Póló webshop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#ren">Rendelés leadása</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#art">Ártáblázat</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#gal">Galéria</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-md mt-4">
        <form>
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Név</label>
                    <input type="text" class="form-control" autofocus>

                    <label class="form-label mt-5">Város</label>
                    <select class="form-select" aria-label="Default select example">
                        <option selected>Budapest</option>
                        <option value="1">Szeged</option>
                        <option value="2">Debrecen</option>
                    </select>
                </div>
                <div class="col-md-5">

                    <label class="form-label-mt-4">Kiszállítás</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                        <label class="form-check-label" for="radioDefault1">
                            Foxpost
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2">
                        <label class="form-check-label" for="radioDefault2">
                            Futár
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
                        <label class="form-check-label" for="radioDefault2">
                            Személyes átvétel üzletünkben
                        </label>

                    </div>

                    <label class="form-label mt-3">Méret</label>
                    <select class="form-select">

                        <option selected="1">S</option>
                        <option value="2">M</option>
                        <option value="3">L</option>
                        <option value="4">XL</option>
                        <option value="5">XXL</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Pólószín</label>
                    <input type="color" class="form-control mt-3">


                    <label class="text mt-3">Vélemény</label>
                    <div class="form-floating">

                        <textarea class="form-control mt-3"></textarea>
                    </div>
                </div>


                <button class="btn btn-primary mt-5" id="ren">Rendelés leadása</button>

            </div>

            <div class="row mt-5">
                <table class="table table-bordered border-primary">
                    <thead id="art">
                        <tr class="table-primary">
                            <th>Méret</th>
                            <th>Ár</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>S</td>
                            <td>500 Ft</td>
                        </tr>
                        <tr>
                            <td>M</td>
                            <td>600 Ft</td>
                        </tr>
                        <tr>
                            <td>L</td>
                            <td>700 Ft</td>
                        </tr>
                        <tr>
                            <td>XL</td>
                            <td>800 Ft</td>
                        </tr>
                        <tr>
                            <td>XXL</td>
                            <td>1000 Ft</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="container text-center" id="gal">
                <div class="row">
                    <div class="col">
                        <img src="images/01.jpg">
                        <img src="images/02.jpg">
                    </div>
                </div>
            </div>

            <div class="container text-center mt-4">
                <div class="row">
                    <div class="col">
                        <img src="images/03.jpg">
                        <img src="images/04.jpg">
                    </div>
                </div>
            </div>

            <div class="container text-center mt-4">
                <div class="row">
                    <div class="col">
                        <img src="images/05.jpg">
                        <img src="images/06.jpg">
                    </div>
                </div>
            </div>
        </form>
</body>

</html>
