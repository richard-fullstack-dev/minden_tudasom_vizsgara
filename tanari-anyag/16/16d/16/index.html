<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulzáró feladat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container-sm">
        <div class="row justify-content-md-center">
            <div class="col-sm-6">
                <h1>Számla szétosztó</h1>
                <label class="form-label">Végösszeg</label>
                <input type="number" class="form-control" id="inp_total" />

                <label class="form-label mt-2">Vendégek száma</label>
                <input type="number" class="form-control" id="inp_num" />

                <label class="form-label mt-2">Legyen-e 15% jatt?</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="inp_tip">
                    <label class="form-check-label">
                        Igen
                    </label>
                </div>

                <button onclick="calculate()" class="btn btn-success mt-2">Számolás!</button>

                <h3 id="h3_result">Fizetendő/fő: </h3>

                <ul class="list-group" id="ul_result">
                    
                </ul>
            </div>
        </div>
    </div>


    <script>
        let values = [];
        function calculate(){
            let total = parseInt(document.getElementById('inp_total').value);
            let num = parseInt(document.getElementById('inp_num').value);
            let tip = document.getElementById('inp_tip').checked;
            
            //tip önmagában boolean, tehát if-be bemehet == true nélkül
            if (tip){
                let costPerPerson = (total * 1.15) / num;
                values.push(costPerPerson);
                document.getElementById('h3_result').innerText = 'Fizetendő/fő: ' + costPerPerson + ' Ft';
            }
            else{
                let costPerPerson = total / num;
                values.push(costPerPerson);
                document.getElementById('h3_result').innerText = 'Fizetendő/fő: ' + costPerPerson + ' Ft';
            }

            document.getElementById('ul_result').innerHTML = '';
            for(let i = 0; i < values.length;i++){
                document.getElementById('ul_result').innerHTML += 
                '<li class="list-group-item">' + values[i] + '</li>';
            }
        }
    </script>

</body>

</html>
