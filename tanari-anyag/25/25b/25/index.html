<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container-md">
        <h1>XYZ Állatmenhely</h1>
        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Állat neve</label>
                <input id="inp_name" type="text" class="form-control" />
                <label class="form-label mt-2">Állat kategória</label>
                <select id="sel_cat" class="form-select">
                    <option value="1">Kutya</option>
                    <option value="2">Macska</option>
                    <option value="3">Nyúl</option>
                </select>
                <button onclick="add()" class="btn btn-success mt-2">Állat hozzáadása</button>
            </div>
            <div class="col-md-6">
                <div id="div_progress" style="height: 100%; font-size: 100px;"
                    class="d-flex justify-content-center align-items-center">

                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-4">
                <h4>Kutyák</h4>
                <ul id="ul_dogs" class="list-group">
                </ul>
            </div>
            <div class="col-md-4">
                <h4>Macskák</h4>
                <ul id="ul_cats" class="list-group">
                </ul>
            </div>
            <div class="col-md-4">
                <h4>Nyulak</h4>
                <ul id="ul_rabbits" class="list-group">
                </ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
