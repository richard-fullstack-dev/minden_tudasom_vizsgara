<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="flex1">
        <label>Név</label>
        <input type="text" />
        <label>Életkor</label>
        <input type="number" />
        <label>Étkezés</label>
        <select>
            <option>Reggeli</option>
            <option>Ebéd</option>
            <option>Vacsora</option>
        </select>
        <label>Pólószín</label>
        <input type="color" />
        <label>Jókedv</label>
        <input type="range" />
        <input type="submit" value="Elküldés" />
    </div>

    <div class="flex2">
        <div class="letter" style="background-color: lightblue;">A</div>
        <div class="letter" style="background-color: lightcoral;">B</div>
        <div class="letter" style="background-color: lightgoldenrodyellow;">C</div>
        <div class="letter" style="background-color: lightgreen;">D</div>
        <div class="letter" style="background-color: lightpink;">E</div>
        <div class="letter" style="background-color: lightsalmon;">F</div>
        <div class="letter" style="background-color: lightgrey;">G</div>
    </div>
    
</body>
</html>
