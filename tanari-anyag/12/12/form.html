<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container-sm">
        <div class="row text-center m-2">
            <h1>Jelentkezés álláshirdetéseinkre</h1>
        </div>

        <form>
            <div class="row gx-5">
                <div class="col-lg-6 mb-3">
                    <h5>Személyes adatok</h5>
                    <label class="form-label">Teljes név</label>
                    <input type="text" class="form-control" />

                    <label class="form-label mt-3">Születési idő</label>
                    <input type="date" class="form-control" />

                    <label class="form-label mt-3">Megpályázni kívánt pozíció</label>
                    <select class="form-select">
                        <option>Frontend fejlesztő</option>
                        <option>Network engineer</option>
                        <option>Projektmenedzser</option>
                    </select>

                    <label class="form-label mt-3">Melyik igaz rád?</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">
                            Jó problémamegoldó képesség
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">
                            Kreatív szemléletmód
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">
                            Határidők pontos betartása
                        </label>
                    </div>

                    <label class="form-label mt-3">Milyen színű belépőkártyát kérsz?</label>
                    <input type="color" class="form-control form-control-color" />
                </div>
                <div class="col-lg-6 mb-3">
                    <h5>Bemutatkozás</h5>
                    <label class="form-label">Motivációs levél</label>
                    <textarea class="form-control" rows="8"></textarea>

                    <label class="form-label mt-3">Önéletrajz feltöltése</label>
                    <input type="file" class="form-control" />

                    <label class="form-label mt-3">Motivációs szinted</label>
                    <input type="range" class="form-range">
                    
                </div>
            </div>

            <div class="row mt-5">
                <div class="col">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">Elfogadom az adatvédelmi szabályzatot</label>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">Elfogadom a GDPR szabályzatot</label>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <input type="submit" class="btn btn-success mt-3" value="Jelentkezés" />
                </div>
            </div>
        </form>
    </div>
</body>

</html>
