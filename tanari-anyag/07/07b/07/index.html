<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="eventform">
        <h3>Regisztrálj a rendezvényre</h3>
        <label>Teljes név</label>
        <input type="text" />
        <label>Választott ajándék</label>
        <select>
            <option>Bögre</option>
            <option>Kulcstartó</option>
            <option>Pénztárca</option>
        </select>
        <label>Választott étkezések</label>

        <div class="checkgroup">
            <input type="checkbox" />
            <span>Reggeli</span>
        </div>

        <div class="checkgroup">
            <input type="checkbox" />
            <span>Ebéd</span>
        </div>

        <div class="checkgroup">
            <input type="checkbox" />
            <span>Vacsora</span>
        </div>

        <label>Lelkesedés foka</label>
        <input type="range" />

        <label>Fénykép feltöltése</label>
        <input type="file" />

        <label>Érkezés dátuma</label>
        <input type="datetime-local" />

        <label>Választott pólószín</label>
        <input type="color" />

        <input type="submit" value="Regisztráció beküldése" />
    </div>
</body>
</html>
