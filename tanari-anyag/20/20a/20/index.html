<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container-lg">
        <div class="row">
            <div class="col-lg-6">
                <label class="form-label">Napi hőmérséklet</label>
                <input type="number" class="form-control" id="inp" />
                <button onclick="add()" class="btn btn-primary mt-2">Rögzítés</button>
                <table class="table table-bordered mt-2">
                    <tbody>
                        <tr>
                            <th>Adatok száma</th>
                            <td id="td_adatok_szama">0</td>
                        </tr>
                        <tr>
                            <th>Átlaghőmérséklet</th>
                            <td id="td_atlaghomerseklet">0 &#8451;</td>
                        </tr>
                        <tr>
                            <th>Maximum érték</th>
                            <td id="td_maximum_ertek">0 &#8451;</td>
                        </tr>
                        <tr>
                            <th>Minimum érték</th>
                            <td id="td_minimum_ertek">0 &#8451;</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="col-lg-6">
                <ul class="list-group mt-2" id="ul">
                </ul>
            </div>
        </div>
    </div>

    <script>
        nums = [];
        function add() {
            let n = parseInt(document.getElementById('inp').value);
            document.getElementById('inp').value = '';
            nums.push(n);
            print();
        }

        function print() {
            document.getElementById('ul').innerHTML = '';

            for (let i = 0; i < nums.length; i++) {
                let text = `
                    <li class="list-group-item d-flex justify-content-between align-items-start">
                        <span style="font-size: 1.2em;">${nums[i]} &#8451;</span>
                        <button onclick="remove(${i})" class="btn btn-sm btn-danger">X</button>
                    </li>`;
                document.getElementById('ul').innerHTML += text;
            }

            print_stat();
        }

        function print_stat() {
            if (nums.length > 0) {
                //hány adatunk van
                let num = nums.length;

                //átlaghőmérséklet
                let avg = nums.reduce((x, y) => x += y) / nums.length;

                let n2 = nums;
                n2.sort((a, b) => b - a);
                let max = n2[0];
                let min = n2[n2.length - 1];

                document.getElementById('td_adatok_szama').innerText = num;
                document.getElementById('td_atlaghomerseklet').innerHTML = avg.toFixed(2) + ' &#8451;';
                document.getElementById('td_maximum_ertek').innerHTML = max + ' &#8451;';
                document.getElementById('td_minimum_ertek').innerHTML = min + ' &#8451;';
            }
            else {
                document.getElementById('td_adatok_szama').innerText = '0';
                document.getElementById('td_atlaghomerseklet').innerHTML = '0 &#8451;';
                document.getElementById('td_maximum_ertek').innerHTML = '0 &#8451;';
                document.getElementById('td_minimum_ertek').innerHTML = '0 &#8451;';
            }

        }

        function remove(x) {
            //x == tömb adott indexe, amit törölni akarunk
            nums2 = [];
            for (let i = 0; i < nums.length; i++) {
                if (i != x) {
                    nums2.push(nums[i]);
                }
            }
            nums = nums2;
            print();
        }
    </script>


</body>

</html>
