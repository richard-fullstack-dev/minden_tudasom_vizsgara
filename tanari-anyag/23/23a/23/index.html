<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 border-bottom p-3">
                <!--űrlap helye-->
                <label class="form-label">Teendő neve</label>
                <input id="inp_name" class="form-control" type="text" />

                <label class="form-label mt-2">Teendő becsült óraszáma</label>
                <input id="inp_duration" class="form-control" type="number" />

                <label class="form-label mt-2">Teendő határideje</label>
                <input id="inp_deadline" class="form-control" type="datetime-local" />

                <button id="btn_add" onclick="addTodo()" class="btn btn-success mt-2"><i class="fa-solid fa-check"></i>
                    Teendő
                    rögzítése</button>
                <br />
                <div class="row">
                    <div class="col-auto">
                        <a id="dwn" class="btn btn-warning mt-2">Letöltés JSON-ként</a>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary mt-2" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasExample" aria-controls="offcanvasExample">
                        JSON visszatöltés
                    </button>
                    </div>
                </div>


            </div>
        </div>
        <div class="row">
            <div class="col-sm-12">
                <div class="progress mt-2">
                    <div id="pb_active" class="progress-bar bg-danger" role="progressbar"></div>
                    <div id="pb_inactive" class="progress-bar bg-success" role="progressbar"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <!--bal hasáb-->
                <h3 class="mt-4 text-center"><i class="fa-regular fa-clock"></i> Aktív teendők</h3>
                <h6 id="h6_active" class="text-center"></h6>
                <div class="text-center m-2" id="dots_active"></div>
                <ul id="ul_active" class="list-group">

                </ul>
            </div>
            <div class="col-sm-6">
                <!--jobb hasáb-->
                <h3 class="mt-4 text-center"><i class="fa-regular fa-circle-check"></i> Végrehajtott teendők</h3>
                <h6 id="h6_inactive" class="text-center"></h6>
                <div class="text-center m-2" id="dots_inactive"></div>
                <ul id="ul_inactive" class="list-group">

                </ul>
            </div>
        </div>
    </div>

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Biztosan elvégezted a teendőt?</h5>
                </div>
                <div class="modal-body" id="modal_body">

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Nem</button>
                    <button type="button" id="btn_yes" data-bs-dismiss="modal" class="btn btn-success">Igen</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="exampleModal2" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Biztosan visszavonod az elvégzett teendőt?</h5>
                </div>
                <div class="modal-body" id="modal_body2">

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Nem</button>
                    <button type="button" id="btn_yes2" data-bs-dismiss="modal" class="btn btn-success">Igen</button>
                </div>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasExampleLabel">JSON fájl import</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div>
                <label class="form-label">Válaszd ki a fájlt!</label>
                <input onchange="upload(event)" type="file" class="form-control mt-2" />
                <button data-bs-dismiss="offcanvas" class="btn btn-success mt-2">Bezárás</button>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
    
</body>

</html>
