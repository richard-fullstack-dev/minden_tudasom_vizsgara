<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h2>Krisztusi kor meghatározó</h2>
                <label class="form-label">Születési éved</label>
                <input id="inp_year" type="number" class="form-control" />
                <button onclick="calculate()" class="btn btn-primary mt-2">Kiszámol!</button>
                <div id="alert_yes" class="alert alert-success mt-2" role="alert" style="display: none;">
                    Te krisztusi korban vagy!
                </div>
                <div id="alert_no" class="alert alert-danger mt-2" style="display: none;" role="alert">
                    Te nem vagy krisztusi korban!
                </div>
            </div>
        </div>
    </div>
    <script>
        function calculate(){
            let year = parseInt(document.getElementById('inp_year').value);
            let year_diff = new Date().getFullYear() - year;
            if (year_diff == 33){
                document.getElementById('alert_yes').style.display = 'block';
            }
            else{
                document.getElementById('alert_no').style.display = 'block';
            }
        }
    </script>

</body>

</html>
